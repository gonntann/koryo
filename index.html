<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AIカメラ・スプリットタイマー Pro</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; overflow-x: hidden; }
    
    /* 設定画面スタイル */
    #setup-view { padding: 20px 15px; text-align: center; }
    h1 { font-size: 1.3rem; margin-bottom: 15px; }
    .card { background: #1c1c1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: left; }
    .card h3 { font-size: 0.9rem; color: #8e8e93; margin-bottom: 10px; }
    input { width: 100%; padding: 12px; font-size: 1rem; background: #2c2c2e; border: 1px solid #3a3a3c; color: #fff; border-radius: 8px; margin-bottom: 10px; }
    
    /* ボタン共通 */
    button { padding: 12px 18px; font-size: 0.95rem; font-weight: 600; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #0a84ff; color: #fff; width: 100%; }
    .btn-success { background: #30d158; color: #fff; }
    .btn-danger { background: #ff453a; color: #fff; }
    .btn-secondary { background: #3a3a3c; color: #fff; }
    .btn-active { border: 2px solid #30d158; background: #1c1c1e; }
    
    /* フル画面カメラ撮影モード View */
    #camera-view { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; flex-direction: column; }
    .camera-header { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent); z-index: 10; display: flex; justify-content: space-between; align-items: center; }
    .camera-container { position: relative; width: 100%; height: 100%; flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    
    video, canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; }
    
    /* カメラオーバーレイUI */
    #timer-overlay { position: absolute; top: 70px; width: 100%; text-align: center; font-size: 3.2rem; font-family: monospace; font-weight: bold; color: #30d158; text-shadow: 0 2px 10px rgba(0,0,0,0.8); z-index: 5; pointer-events: none; }
    
    .camera-controls { position: absolute; bottom: 20px; left: 0; width: 100%; padding: 10px 20px; display: flex; justify-content: space-around; align-items: center; z-index: 10; background: linear-gradient(0deg, rgba(0,0,0,0.8), transparent); }
    .shutter-btn { width: 65px; height: 65px; border-radius: 50%; border: 4px solid #fff; background: #ff453a; }
    .shutter-btn.recording { animation: pulse 1s infinite; background: #ff0000; }
    
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

    /* 通過ログ */
    ul { list-style: none; padding: 0; }
    li { background: #2c2c2e; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; font-family: monospace; }
  </style>
</head>
<body>

  <div id="setup-view">
    <h1>🏃 AIカメラ・タイマー Pro</h1>

    <div class="card">
      <h3>① 端末通信連携</h3>
      <p style="font-size:0.85rem; color:#aaa; margin-bottom:8px;">自端末ID: <strong id="my-id" style="color:#30d158">接続中...</strong></p>
      <input type="text" id="target-id" placeholder="接続先(親機)のIDを入力">
      <button class="btn-primary" onclick="connectToParent()">相手の端末と接続</button>
    </div>

    <div class="card">
      <h3>② AI検知の役割</h3>
      <div style="display:flex; gap:10px;">
        <button id="role-start" class="btn-secondary" style="flex:1" onclick="setRole('START')">① スタート用</button>
        <button id="role-split" class="btn-secondary btn-active" style="flex:1" onclick="setRole('SPLIT')">② ゴール用</button>
      </div>
    </div>

    <button class="btn-success" style="width:100%; padding:16px; font-size:1.1rem; margin-bottom:15px;" onclick="openCameraView()">📷 撮影モードを開始</button>

    <div class="card">
      <h3>⏱️ 記録ログ</h3>
      <ul id="records"></ul>
    </div>
  </div>

  <div id="camera-view">
    <div class="camera-header">
      <button class="btn-secondary" onclick="closeCameraView()">✕ 戻る</button>
      <button class="btn-secondary" onclick="switchCamera()">🔄 カメラ切替</button>
      <button class="btn-secondary" id="auto-btn" onclick="toggleAutoMode()">AI検知: ON</button>
    </div>

    <div id="timer-overlay">00:00.000</div>

    <div class="camera-container">
      <video id="input_video" playsinline style="display:none;"></video>
      <canvas id="output_canvas"></canvas>
    </div>

    <div class="camera-controls">
      <button class="btn-success" onclick="broadcastSignal('START')">手動スタート</button>
      <button class="shutter-btn" id="record-btn" onclick="toggleRecording()"></button>
      <button class="btn-danger" onclick="broadcastSignal('RESET')">リセット</button>
    </div>
  </div>

  <script>
    let peer = new Peer();
    let connections = [];
    let startTime = 0;
    let timerInterval = null;
    let autoDetect = true;
    let hasPassed = false;
    let currentRole = 'SPLIT';
    let facingMode = 'environment'; // 'environment'(外カメ) または 'user'(インカメ)
    
    // 録画関係変数
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    // --- PeerJS（通信機能） ---
    peer.on('open', id => document.getElementById('my-id').innerText = id);
    peer.on('connection', conn => { connections.push(conn); setupDataHandler(conn); });

    function connectToParent() {
      const targetId = document.getElementById('target-id').value;
      if (!targetId) return alert("IDを入力してください");
      const conn = peer.connect(targetId);
      connections.push(conn);
      setupDataHandler(conn);
      alert("接続しました！");
    }

    function setupDataHandler(conn) {
      conn.on('data', data => {
        if (data.type === 'START') { startTime = data.timestamp; startTimerUI(); }
        else if (data.type === 'SPLIT') { addSplitRecord(data.deviceName, data.timestamp - startTime); }
        else if (data.type === 'RESET') { resetTimerUI(); }
      });
    }

    function broadcastSignal(type) {
      const timestamp = Date.now();
      const payload = { type, timestamp, deviceName: `端末(${peer.id.slice(0, 4)})` };

      if (type === 'START') { startTime = timestamp; startTimerUI(); }
      else if (type === 'SPLIT') { if (startTime === 0) return; addSplitRecord(payload.deviceName, timestamp - startTime); }
      else if (type === 'RESET') { resetTimerUI(); }

      connections.forEach(conn => conn.send(payload));
    }

    function setRole(role) {
      currentRole = role;
      document.getElementById('role-start').classList.toggle('btn-active', role === 'START');
      document.getElementById('role-split').classList.toggle('btn-active', role === 'SPLIT');
      hasPassed = false;
    }

    // --- 画面切り替え ＆ カメラ設定 ---
    let cameraInstance = null;

    function openCameraView() {
      document.getElementById('camera-view').style.display = 'flex';
      initCamera();
    }

    function closeCameraView() {
      document.getElementById('camera-view').style.display = 'none';
    }

    function switchCamera() {
      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      initCamera();
    }

    function initCamera() {
      if (cameraInstance) cameraInstance.stop();

      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;

      cameraInstance = new Camera(videoElement, {
        onFrame: async () => { await pose.send({ image: videoElement }); },
        width: 1280,
        height: 720,
        facingMode: facingMode
      });
      cameraInstance.start();
    }

    // --- AI判定ロジック (MediaPipe Pose) ---
    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
    pose.onResults(onResults);

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      // アスペクト比を維持して全画面描画
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // 中央判定線（赤線）
      const lineX = canvasElement.width / 2;
      canvasCtx.beginPath();
      canvasCtx.moveTo(lineX, 0);
      canvasCtx.lineTo(lineX, canvasElement.height);
      canvasCtx.lineWidth = 4;
      canvasCtx.strokeStyle = "rgba(255, 69, 58, 0.8)";
      canvasCtx.stroke();

      if (results.poseLandmarks) {
        const nose = results.poseLandmarks[0];
        const noseX = nose.x * canvasElement.width;
        const noseY = nose.y * canvasElement.height;

        canvasCtx.beginPath();
        canvasCtx.arc(noseX, noseY, 10, 0, 2 * Math.PI);
        canvasCtx.fillStyle = "#30d158";
        canvasCtx.fill();

        // 右から左への通過判定
        if (autoDetect && !hasPassed) {
          if (noseX < lineX) {
            hasPassed = true;
            if (currentRole === 'START') {
              broadcastSignal('START');
            } else if (currentRole === 'SPLIT' && startTime > 0) {
              broadcastSignal('SPLIT');
            }
          }
        }
      }
      canvasCtx.restore();
    }

    // --- 動画録画機能 ---
    function toggleRecording() {
      const btn = document.getElementById('record-btn');
      if (!isRecording) {
        // 録画開始 (Canvasの映像をキャプチャ)
        const stream = canvasElement.captureStream(30);
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        recordedChunks = [];

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = saveVideo;

        mediaRecorder.start();
        isRecording = true;
        btn.classList.add('recording');
      } else {
        // 録画停止
        mediaRecorder.stop();
        isRecording = false;
        btn.classList.remove('recording');
      }
    }

    function saveVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `timer_video_${Date.now()}.webm`;
      a.click();
      URL.revokeObjectURL(url);
      alert("録画動画を端末に保存しました！");
    }

    // --- タイマーUI処理 ---
    function startTimerUI() {
      clearInterval(timerInterval);
      document.getElementById('records').innerHTML = '';
      timerInterval = setInterval(() => {
        document.getElementById('timer-overlay').innerText = formatTime(Date.now() - startTime);
      }, 10);
    }

    function resetTimerUI() {
      clearInterval(timerInterval);
      startTime = 0;
      hasPassed = false;
      document.getElementById('timer-overlay').innerText = "00:00.000";
      document.getElementById('records').innerHTML = '';
    }

    function addSplitRecord(device, timeMs) {
      const li = document.createElement('li');
      li.innerHTML = `<span>${device}</span> <strong>${formatTime(timeMs)}</strong>`;
      document.getElementById('records').prepend(li);
    }

    function formatTime(ms) {
      const m = String(Math.floor(ms / 60000)).padStart(2, '0');
      const s = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
      const msStr = String(ms % 1000).padStart(3, '0');
      return `${m}:${s}.${msStr}`;
    }

    function toggleAutoMode() {
      autoDetect = !autoDetect;
      document.getElementById('auto-btn').innerText = `AI検知: ${autoDetect ? 'ON' : 'OFF'}`;
    }
  </script>
</body>
</html>
