<html lang="ja">

    /* 1. 設定画面 */
    #setup-view { width: 100%; height: 100%; padding: 15px; overflow-y: auto; text-align: center; background: #121212; }
    h1 { font-size: 1.2rem; margin-bottom: 12px; }
    .card { background: #1c1c1e; padding: 12px; border-radius: 12px; margin-bottom: 12px; text-align: left; }
    .card h3 { font-size: 0.85rem; color: #8e8e93; margin-bottom: 8px; }
    input { width: 100%; padding: 10px; font-size: 0.95rem; background: #2c2c2e; border: 1px solid #3a3a3c; color: #fff; border-radius: 8px; margin-bottom: 8px; }
    
    button { padding: 10px 14px; font-size: 0.9rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; }
    .btn-primary { background: #0a84ff; color: #fff; width: 100%; }
    .btn-success { background: #30d158; color: #fff; }
    .btn-secondary { background: #3a3a3c; color: #fff; }
    .btn-danger { background: #ff453a; color: #fff; }
    .btn-active { border: 2px solid #30d158; background: #2c2c2e; }
    
    /* 2. 撮影モード View */
    #camera-view { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; flex-direction: column; align-items: center; justify-content: space-between; }
    
    /* ヘッダー */
    .camera-header { width: 100%; padding: 10px 15px; background: rgba(0,0,0,0.8); z-index: 10; display: flex; justify-content: space-between; align-items: center; }
    .icon-btn { background: rgba(255,255,255,0.15); color: #fff; font-size: 1.1rem; padding: 6px 12px; border-radius: 50%; border: none; }
    
    /* 撮影エリア：スマホ画面の約7割の高さ ＆ 縦16:横9比率 */
    .camera-container {
      position: relative;
      height: 68vh;
      aspect-ratio: 9 / 16;
      background: #111;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      margin: auto 0;
    }
