<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AIカメラ・スプリットタイマー Pro</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
    
    /* 1. 設定画面 */
    #setup-view { width: 100%; height: 100%; padding: 15px; overflow-y: auto; text-align: center; background: #121212; }
    h1 { font-size: 1.2rem; margin-bottom: 12px; }
    .card { background: #1c1c1e; padding: 12px; border-radius: 12px; margin-bottom: 12px; text-align: left; }
    .card h3 { font-size: 0.85rem; color: #8e8e93; margin-bottom: 8px; }
    input { width: 100%; padding: 10px; font-size: 0.95rem; background: #2c2c2e; border: 1px solid #3a3a3c; color: #fff; border-radius: 8px; margin-bottom: 8px; }
    
    button { padding: 10px 14px; font-size: 0.9rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; }
    .btn-primary { background: #0a84ff; color: #fff; width: 100%; }
    .btn-success { background: #30d158; color: #fff; }
    .btn-secondary { background: #3a3a3c; color: #fff; }
    .btn-active { border: 2px solid #30d158; background: #2c2c2e; }
    
    /* 2. 大画面撮影モード View */
    #camera-view { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; flex-direction: column; justify-content: space-between; }
    
    .camera-header { position: absolute; top: 0; left: 0; width: 100%; padding: 10px 15px; background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent); z-index: 10; display: flex; justify-content: space-between; align-items: center; }
    .icon-btn { background: rgba(0,0,0,0.5); color: #fff; font-size: 1.2rem; padding: 8px 12px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); }
    
    .camera-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    
    #timer-overlay { position: absolute; top: 60px; width: 100%; text-align: center; font-size: 2.8rem; font-family: monospace; font-weight: bold; color: #30d158; text-shadow: 0 2px 8px rgba(0,0,0,0.9); z-index: 5; pointer-events: none; }
    
    /* コントロール操作部 */
    .camera-controls { position: absolute; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: space-around; align-items: center; z-index: 10; padding: 0 20px; }
    
    /* 赤い丸のスタート/ストップシャッターボタン */
    .shutter-btn { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: #ff453a; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: transform 0.1s; }
    .shutter-btn:active { transform: scale(0.92); }
    .shutter-btn.active-rec { background: #ff0000; animation: pulse 1s infinite; border-radius: 18px; } /* 録画停止状態 */

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

    ul { list-style: none; padding: 0; }
    li { background: #2c2c2e; padding: 10px; border-radius: 8px; margin-bottom: 6px; display: flex; justify-content: space-between; font-family: monospace; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div id="setup-view">
    <h1>🏃 AIカメラ・タイマー Pro</h1>

    <div class="card">
      <h3>① 端末通信連携</h3>
      <p style="font-size:0.8rem; color:#aaa; margin-bottom:6px;">自端末ID: <strong id="my-id" style="color:#30d158">接続中...</strong></p>
      <input type="text" id="target-id" placeholder="相手端末のIDを入力">
      <button class="btn-primary" onclick="connectToParent()">接続する</button>
    </div>

    <div class="card">
      <h3>② AI検知役割</h3>
      <div style="display:flex; gap:8px;">
        <button id="role-start" class="btn-secondary" style="flex:1" onclick="setRole('START')">① スタート用</button>
        <button id="role-split" class="btn-secondary btn-active" style="flex:1" onclick="setRole('SPLIT')">② ゴール用</button>
      </div>
    </div>

    <button class="btn-success" style="width:100%; padding:14px; font-size:1rem; margin-bottom:12px;" onclick="openCameraView()">📷 撮影モードを開始</button>

    <div class="card">
      <h3>⏱️ タイムログ</h3>
      <ul id="records"></ul>
    </div>
  </div>

  <div id="camera-view">
    <div class="camera-header">
      <button class="icon-btn" onclick="closeCameraView()">✕</button>
      <button class="icon-btn" onclick="switchCamera()">🔄</button>
      <button class="btn-secondary" id="auto-btn" style="font-size:0.8rem;" onclick="toggleAutoMode()">AI: ON</button>
    </div>

    <div id="timer-overlay">00:00.000</div>

    <div class="camera-container">
      <video id="input_video" playsinline style="display:none;"></video>
      <canvas id="output_canvas"></canvas>
    </div>

    <div class="camera-controls">
      <button class="btn-secondary" style="font-size:0.8rem;" onclick="broadcastSignal('RESET')">リセット</button>
      
      <button class="shutter-btn" id="shutter" onclick="handleShutter()"></button>
      
      <div style="width: 60px;"></div> </div>
  </div>

  <script>
    let peer = new Peer();
    let connections = [];
    let startTime = 0;
    let timerInterval = null;
    let autoDetect = true;
    let hasPassed = false;
    let currentRole = 'SPLIT';
    let facingMode = 'environment';
    
    // 録画制御
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRunning = false;

    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    peer.on('open', id => document.getElementById('my-id').innerText = id);
    peer.on('connection', conn => { connections.push(conn); setupDataHandler(conn); });

    function connectToParent() {
      const targetId = document.getElementById('target-id').value;
      if (!targetId) return alert("IDを入力してください");
      const conn = peer.connect(targetId);
      connections.push(conn);
      setupDataHandler(conn);
      alert("接続成功しました");
    }

    function setupDataHandler(conn) {
      conn.on('data', data => {
        if (data.type === 'START') { startTime = data.timestamp; startTimerUI(); }
        else if (data.type === 'SPLIT') { addSplitRecord(data.deviceName, data.timestamp - startTime); }
        else if (data.type === 'RESET') { resetTimerUI(); }
      });
    }

    function broadcastSignal(type) {
      const timestamp = Date.now();
      const payload = { type, timestamp, deviceName: `端末(${peer.id.slice(0, 4)})` };

      if (type === 'START') { startTime = timestamp; startTimerUI(); }
      else if (type === 'SPLIT') { if (startTime === 0) return; addSplitRecord(payload.deviceName, timestamp - startTime); }
      else if (type === 'RESET') { resetTimerUI(); }

      connections.forEach(conn => conn.send(payload));
    }

    function setRole(role) {
      currentRole = role;
      document.getElementById('role-start').classList.toggle('btn-active', role === 'START');
      document.getElementById('role-split').classList.toggle('btn-active', role === 'SPLIT');
      hasPassed = false;
    }

    // カメラ＆画面処理
    let cameraInstance = null;

    function openCameraView() {
      document.getElementById('camera-view').style.display = 'flex';
      initCamera();
    }

    function closeCameraView() {
      document.getElementById('camera-view').style.display = 'none';
      if (isRecording()) stopRecordingAndSave();
    }

    function switchCamera() {
      facingMode = (facingMode === 'environment') ? 'user' : 'environment';
      initCamera();
    }

    function initCamera() {
      if (cameraInstance) cameraInstance.stop();

      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;

      // 軽量化設定でカクつきを大幅低減
      cameraInstance = new Camera(videoElement, {
        onFrame: async () => { await pose.send({ image: videoElement }); },
        width: 640,
        height: 480,
        facingMode: facingMode
      });
      cameraInstance.start();
    }

    // 高速化・軽量化設定のMediaPipe Pose
    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 0, smoothLandmarks: true, minDetectionConfidence: 0.5 }); // Complexity 0で高速化
    pose.onResults(onResults);

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      const lineX = canvasElement.width / 2;
      canvasCtx.beginPath();
      canvasCtx.moveTo(lineX, 0);
      canvasCtx.lineTo(lineX, canvasElement.height);
      canvasCtx.lineWidth = 3;
      canvasCtx.strokeStyle = "rgba(255, 69, 58, 0.8)";
      canvasCtx.stroke();

      if (results.poseLandmarks) {
        const nose = results.poseLandmarks[0];
        const noseX = nose.x * canvasElement.width;
        const noseY = nose.y * canvasElement.height;

        canvasCtx.beginPath();
        canvasCtx.arc(noseX, noseY, 8, 0, 2 * Math.PI);
        canvasCtx.fillStyle = "#30d158";
        canvasCtx.fill();

        // 右から左への判定
        if (autoDetect && !hasPassed) {
          if (noseX < lineX) {
            hasPassed = true;
            if (currentRole === 'START') {
              broadcastSignal('START');
              startRecording();
            } else if (currentRole === 'SPLIT' && startTime > 0) {
              broadcastSignal('SPLIT');
            }
          }
        }
      }
      canvasCtx.restore();
    }

    // 赤い丸ボタン（シャッター）操作
    function handleShutter() {
      const btn = document.getElementById('shutter');
      
      if (!isRunning) {
        // スタート（計測・録画開始）
        broadcastSignal('START');
        startRecording();
        btn.classList.add('active-rec');
        isRunning = true;
      } else {
        // ストップ（計測停止・録画自動保存）
        stopRecordingAndSave();
        btn.classList.remove('active-rec');
        isRunning = false;
      }
    }

    // 録画機能
    function startRecording() {
      recordedChunks = [];
      const stream = canvasElement.captureStream(30);
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.start();
    }

    function isRecording() {
      return mediaRecorder && mediaRecorder.state === 'recording';
    }

    function stopRecordingAndSave() {
      if (isRecording()) {
        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `timer_record_${Date.now()}.webm`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };
        mediaRecorder.stop();
      }
    }

    // タイマー UI
    function startTimerUI() {
      clearInterval(timerInterval);
      document.getElementById('records').innerHTML = '';
      timerInterval = setInterval(() => {
        document.getElementById('timer-overlay').innerText = formatTime(Date.now() - startTime);
      }, 10);
    }

    function resetTimerUI() {
      clearInterval(timerInterval);
      startTime = 0;
      hasPassed = false;
      document.getElementById('timer-overlay').innerText = "00:00.000";
      document.getElementById('records').innerHTML = '';
    }

    function addSplitRecord(device, timeMs) {
      const li = document.createElement('li');
      li.innerHTML = `<span>${device}</span> <strong>${formatTime(timeMs)}</strong>`;
      document.getElementById('records').prepend(li);
    }

    function formatTime(ms) {
      const m = String(Math.floor(ms / 60000)).padStart(2, '0');
      const s = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
      const msStr = String(ms % 1000).padStart(3, '0');
      return `${m}:${s}.${msStr}`;
    }

    function toggleAutoMode() {
      autoDetect = !autoDetect;
      document.getElementById('auto-btn').innerText = `AI: ${autoDetect ? 'ON' : 'OFF'}`;
    }
  </script>
</body>
</html>
